# The first CI for this repository: one job, `check`, running the same gate as `bun run check` on a macOS runner.
#
#   typecheck, the async lint, the unit and integration suites (src/, including the remote gateway's security tests under
#   src/bun/remote/), the build-script tests, and the protocol package's tests and vectors.
#
# The owner marks `check` as a REQUIRED status check in the repository's branch protection (a GitHub setting this workflow cannot
# change). Playwright is not part of CI: the e2e suite stays local (docs/plans/remote-readiness.md A-2).
#
# `CI=true` makes the tests that skip loudly on a developer machine (they need tmux or swiftc) fail here instead of skipping.
#
# Known red at first: the pre-existing failures on `main` (tmux-socket.test.ts, reconcile.test.ts "startTask honors cancel",
# model-discovery.test.ts copilot refreshAllModels, github-network.test.ts) and any macOS-runner gaps (a test that needs `claude`
# on PATH). They are recorded in docs/plans/remote-readiness.md and fixed in a separate ticket; nothing here skips or loosens them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      # The terminal tests attach to a real tmux session, so the runner needs one.
      - name: Install tmux
        run: brew install tmux

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check (typecheck, async lint, unit and integration tests, package tests)
        run: bun run check

      # The key helper's Swift side must agree with the TypeScript vectors (SAS, canonical JSON, pairing QR): an ad-hoc build runs
      # `selftest-vectors` and CI2 asserts all three vector files were checked, none skipped.
      - name: Key helper vectors
        run: |
          bun scripts/build-keyhelper.ts --adhoc
          out="$(vendor/keyhelper/AgetorKeyHelper.app/Contents/MacOS/keyhelper selftest-vectors packages/remote-protocol/vectors)"
          echo "$out"
          for f in agetor-derive.json agetor-canonical-json.json agetor-qr.json; do
            echo "$out" | grep -q "checked $f" || { echo "vector file $f was not checked"; exit 1; }
          done
